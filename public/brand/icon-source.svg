<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" fill="#1C3829"/>

  <!-- Outer ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#F6F3EE" stroke-width="10" opacity="0.6"/>

  <!-- Cardinal ticks -->
  <line x1="256" y1="66" x2="256" y2="104" stroke="#F6F3EE" stroke-width="10" stroke-linecap="round" opacity="0.6"/>
  <line x1="446" y1="256" x2="408" y2="256" stroke="#F6F3EE" stroke-width="10" stroke-linecap="round" opacity="0.6"/>
  <line x1="256" y1="446" x2="256" y2="408" stroke="#F6F3EE" stroke-width="10" stroke-linecap="round" opacity="0.6"/>
  <line x1="66" y1="256" x2="104" y2="256" stroke="#F6F3EE" stroke-width="10" stroke-linecap="round" opacity="0.6"/>

  <!-- Needle — 35° off north -->
  <g transform="rotate(35 256 256)">
    <!-- Gold tip (north) -->
    <polygon points="256,96 282,256 230,256" fill="#C8993A"/>
    <!-- Fog tail (south) -->
    <polygon points="256,400 282,256 230,256" fill="#F6F3EE" opacity="0.25"/>
  </g>

  <!-- Pivot -->
  <circle cx="256" cy="256" r="18" fill="#1C3829"/>
  <circle cx="256" cy="256" r="9" fill="#F6F3EE" opacity="0.7"/>
</svg>
