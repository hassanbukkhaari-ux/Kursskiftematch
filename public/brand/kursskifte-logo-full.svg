    <circle r="110" fill="none" stroke="#1C3829" stroke-width="3.5"/>
    <line x1="0" y1="-110" x2="0" y2="-94" stroke="#1C3829" stroke-width="3.5"/>
    <line x1="110" y1="0" x2="94" y2="0" stroke="#1C3829" stroke-width="3.5"/>
